
name: CI - Flask DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verificar qualidade do código
        run: ruff check app tests

      - name: Executar testes
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" pytest -v --cov=app --cov-report=term-missing

  docker-build:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-and-tests

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: projeto-devops:${{ github.sha }}
