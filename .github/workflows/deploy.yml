name: Deploy

on:
  workflow_dispatch:

permissions:
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem do GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/projeto_devops:latest

      - name: Executar aplicação
        run: |
          docker run -d --name projeto_devops_container -p 5000:5000 ghcr.io/${{ github.repository_owner }}/projeto_devops:latest
          sleep 5
          curl --fail http://localhost:5000/health
          docker stop projeto_devops_container
