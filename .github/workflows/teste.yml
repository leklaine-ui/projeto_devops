name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes
        run: pytest

      - name: Construir imagem Docker
        run: docker build -t projeto_devops .

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem Docker
        run: |
          docker tag projeto_devops ghcr.io/${{ github.repository_owner }}/projeto_devops:latest
          docker push ghcr.io/${{ github.repository_owner }}/projeto_devops:latest
