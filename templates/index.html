<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto DevOps</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitulo {
            margin-top: 0;
            margin-bottom: 25px;
            color: #666;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .campos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        #historico {
            padding: 0;
        }

        li {
            list-style: none;
            margin-bottom: 12px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .usuario {
            font-weight: bold;
        }

        .data-hora {
            display: block;
            margin-top: 7px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .campos {
                flex-direction: column;
            }

            input,
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Aplicação DevOps</h1>

        <p class="subtitulo">Envie mensagens e acompanhe o histórico da aplicação.</p>

        <div class="formulario">
            <div class="campos">
                <input
                    id="usuario"
                    type="text"
                    placeholder="Digite seu nome"
                >

                <input
                    id="mensagem"
                    type="text"
                    placeholder="Digite uma mensagem"
                >

                <button onclick="enviarMensagem()">
                    Enviar
                </button>
            </div>
        </div>

        <h2>Histórico de mensagens</h2>

        <ul id="historico">
        </ul>

    </div>

    <script>

        function carregarMensagens() {

            fetch("/api/mensagens")

                .then(resposta => resposta.json())

                .then(mensagens => {

                    const lista =
                        document.getElementById("historico");

                    lista.innerHTML = "";

                    mensagens.forEach(item => {

                        const linha =
                            document.createElement("li");

                        const usuario = document.createElement("span");
                        usuario.className = "usuario";
                        usuario.textContent = item.usuario;

                        const mensagem = document.createElement("span");
                        mensagem.textContent = " — " + item.mensagem;

                        const dataHora = document.createElement("span");
                        dataHora.className = "data-hora";
                        dataHora.textContent = item.data_hora;

                        linha.textContent = item.id + " - ";
                        linha.appendChild(usuario);
                        linha.appendChild(mensagem);
                        linha.appendChild(dataHora);

                        lista.appendChild(linha);

                    });

                });
        }


        function enviarMensagem() {

            const usuario =
                document.getElementById("usuario").value.trim();

            const campo =
                document.getElementById("mensagem");

            const mensagem =
                campo.value.trim();

            if (usuario === "" || mensagem === "") {
                return;
            }

            fetch("/api/mensagem", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuario: usuario,
                    mensagem: mensagem
                })

            })

            .then(resposta => resposta.json())

            .then(dados => {

                campo.value = "";

                carregarMensagens();

            });
        }


        carregarMensagens();

    </script>

</body>

</html>
