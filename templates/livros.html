```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Livros</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        main {
            max-width: 950px;
            margin: auto;
        }

        h1 { color: #1d4ed8; }

        .painel, .livro {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000d;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button, .link {
            display: inline-block;
            margin-top: 14px;
            padding: 10px 15px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .secundario { background: #64748b; }
        .mensagem { margin: 12px 0; }
        .vazio { color: #64748b; }

        @media (max-width: 600px) {
            body { padding: 12px; }
        }
    </style>
</head>
<body>
<main>
    <h1>📚 Biblioteca de Livros</h1>
    <p>Cadastre, consulte e edite seus livros.</p>
    <a class="link" href="/">Voltar ao chat</a>

    <section class="painel">
        <h2 id="titulo-formulario">Cadastrar livro</h2>

        <form id="form-livro">
            <input type="hidden" id="livro-id">

            <label for="titulo">Título *</label>
            <input id="titulo" required maxlength="250">

            <label for="autor">Autor</label>
            <input id="autor" maxlength="250">

            <label for="descricao">Descrição</label>
            <textarea id="descricao"></textarea>

            <button type="submit" id="botao-salvar">Cadastrar livro</button>
            <button type="button" class="secundario"
                    id="botao-cancelar" hidden>
                Cancelar edição
            </button>
        </form>

        <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section>
        <h2>Livros cadastrados</h2>
        <div id="lista-livros">Carregando livros...</div>
    </section>

    <section class="painel" id="painel-capitulos" hidden>
        <h2 id="titulo-painel-capitulos">Capítulos do livro</h2>
        <p id="mensagem-capitulo" class="mensagem" role="status"></p>

        <form id="form-capitulo">
            <input type="hidden" id="capitulo-id">

            <label for="titulo-capitulo">Título do capítulo *</label>
            <input id="titulo-capitulo" required maxlength="250">

            <label for="ordem-capitulo">Ordem *</label>
            <input id="ordem-capitulo" type="number" min="1" value="1" required>

            <label for="conteudo-capitulo">Conteúdo</label>
            <textarea id="conteudo-capitulo" rows="10" lang="pt-BR" spellcheck="true"></textarea>
            <button type="button" class="secundario"
                    id="botao-organizar-paragrafos">
                Organizar parágrafos
            </button>

            <button type="button" class="secundario"
                    id="botao-corrigir-texto">
                Corrigir texto
            </button>

            <div id="resultados-corretor"
                 aria-live="polite"></div>

            <button type="submit" id="botao-salvar-capitulo">
                Salvar capítulo
            </button>
            <button type="button" class="secundario"
                    id="botao-cancelar-capitulo" hidden>
                Cancelar edição
            </button>
            <button type="button" class="secundario"
                    id="botao-fechar-capitulos">
                Fechar capítulos
            </button>
        </form>

        <h3>Capítulos cadastrados</h3>
        <div id="lista-capitulos">Selecione um livro.</div>
    </section>
</main>

<script>
    const formulario = document.getElementById("form-livro");
    const campoId = document.getElementById("livro-id");
    const campoTitulo = document.getElementById("titulo");
    const campoAutor = document.getElementById("autor");
    const campoDescricao = document.getElementById("descricao");
    const mensagem = document.getElementById("mensagem");
    const lista = document.getElementById("lista-livros");
    const botaoSalvar = document.getElementById("botao-salvar");
    const botaoCancelar = document.getElementById("botao-cancelar");

    const painelCapitulos = document.getElementById("painel-capitulos");
    const tituloPainelCapitulos =
        document.getElementById("titulo-painel-capitulos");
    const formularioCapitulo = document.getElementById("form-capitulo");
    const campoCapituloId = document.getElementById("capitulo-id");
    const campoTituloCapitulo = document.getElementById("titulo-capitulo");
    const campoOrdemCapitulo = document.getElementById("ordem-capitulo");
    const campoConteudoCapitulo = document.getElementById("conteudo-capitulo");
    const botaoOrganizarParagrafos =
        document.getElementById("botao-organizar-paragrafos");
    const botaoCorrigirTexto =
        document.getElementById("botao-corrigir-texto");
    const resultadosCorretor =
        document.getElementById("resultados-corretor");

    botaoCorrigirTexto.addEventListener("click", async () => {
        const textoOriginal = campoConteudoCapitulo.value;

        if (!textoOriginal.trim()) {
            mostrarMensagemCapitulo(
                "Digite o conteúdo do capítulo antes de corrigir."
            );
            return;
        }

        botaoCorrigirTexto.disabled = true;
        resultadosCorretor.textContent = "";
        mostrarMensagemCapitulo("Analisando o texto...");

        try {
            const resposta = await fetch(
                "/api/capitulos/corrigir-texto",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ texto: textoOriginal })
                }
            );

            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    dados.erro || "Não foi possível corrigir o texto."
                );
            }

            const resumo = document.createElement("p");
            resumo.textContent =
                "Análise concluída. Ocorrências encontradas: " +
                dados.quantidade + ".";
            resultadosCorretor.appendChild(resumo);

            if (!Array.isArray(dados.sugestoes) ||
                dados.sugestoes.length === 0) {
                const semSugestoes = document.createElement("p");
                semSugestoes.textContent =
                    "Nenhuma sugestão encontrada.";
                resultadosCorretor.appendChild(semSugestoes);
            } else {
                const listaSugestoes = document.createElement("ol");

                for (const item of dados.sugestoes) {
                    const entrada = document.createElement("li");
                    const trecho = document.createElement("p");
                    const explicacao = document.createElement("p");

                    trecho.textContent =
                        "Trecho: " + (item.trecho || "Não informado");
                    explicacao.textContent =
                        "Explicação: " +
                        (item.mensagem || "Sem explicação disponível.");

                    entrada.appendChild(trecho);
                    entrada.appendChild(explicacao);

                    if (Array.isArray(item.sugestoes) &&
                        item.sugestoes.length > 0) {
                        const titulo = document.createElement("p");
                        titulo.textContent = "Sugestões:";
                        entrada.appendChild(titulo);

                        const alternativas = document.createElement("ul");

                        for (const sugestao of item.sugestoes) {
                            const alternativa =
                                document.createElement("li");
                            alternativa.textContent = sugestao;
                            alternativas.appendChild(alternativa);
                        }

                        entrada.appendChild(alternativas);
                    }

                    listaSugestoes.appendChild(entrada);
                }

                resultadosCorretor.appendChild(listaSugestoes);
            }

            mostrarMensagemCapitulo(
                "Revisão concluída. O texto original foi preservado."
            );
        } catch (erro) {
            mostrarMensagemCapitulo(
                erro.message || "Erro ao consultar o corretor."
            );
        } finally {
            botaoCorrigirTexto.disabled = false;
        }
    });

    botaoOrganizarParagrafos.addEventListener("click", () => {
        const linhas = campoConteudoCapitulo.value
            .split(String.fromCharCode(10))
            .map((linha) => linha.trimEnd());

        const organizadas = [];
        let linhaVaziaAnterior = false;

        for (const linha of linhas) {
            const vazia = linha.trim() === "";

            if (vazia && linhaVaziaAnterior) {
                continue;
            }

            organizadas.push(linha);
            linhaVaziaAnterior = vazia;
        }

        campoConteudoCapitulo.value = organizadas.join(
            String.fromCharCode(10)
        ).trim();

        mostrarMensagemCapitulo(
            "Parágrafos organizados. Revise antes de salvar."
        );
    });

    const mensagemCapitulo = document.getElementById("mensagem-capitulo");
    const listaCapitulos = document.getElementById("lista-capitulos");
    const botaoSalvarCapitulo =
        document.getElementById("botao-salvar-capitulo");
    const botaoCancelarCapitulo =
        document.getElementById("botao-cancelar-capitulo");
    let livroCapitulosId = null;

    function mostrarMensagem(texto) {
        mensagem.textContent = texto;
    }

    function cancelarEdicao() {
        formulario.reset();
        campoId.value = "";
        document.getElementById("titulo-formulario").textContent =
            "Cadastrar livro";
        botaoSalvar.textContent = "Cadastrar livro";
        botaoCancelar.hidden = true;
    }

    function mostrarMensagemCapitulo(texto) {
        mensagemCapitulo.textContent = texto;
    }

    function limparFormularioCapitulo() {
        formularioCapitulo.reset();
        campoCapituloId.value = "";
        campoOrdemCapitulo.value = "1";
        botaoSalvarCapitulo.textContent = "Salvar capítulo";
        botaoCancelarCapitulo.hidden = true;
    }

    async function abrirCapitulos(livro) {
        livroCapitulosId = livro.id;
        tituloPainelCapitulos.textContent = "Capítulos: " + livro.titulo;
        painelCapitulos.hidden = false;
        limparFormularioCapitulo();
        mostrarMensagemCapitulo("");
        await carregarCapitulos();
        painelCapitulos.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function carregarCapitulos() {
        listaCapitulos.textContent = "Carregando capítulos...";

        try {
            const resposta = await fetch(
                "/api/livros/" + livroCapitulosId
            );
            const livro = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    livro.erro || "Não foi possível carregar o livro."
                );
            }

            listaCapitulos.replaceChildren();
            const capitulos = livro.capitulos || [];

            if (capitulos.length === 0) {
                listaCapitulos.textContent = "Nenhum capítulo cadastrado.";
                listaCapitulos.className = "vazio";
                return;
            }

            listaCapitulos.className = "";

            capitulos.forEach(capitulo => {
                const cartao = document.createElement("article");
                cartao.className = "capitulo";

                const titulo = document.createElement("h4");
                titulo.textContent = capitulo.ordem + ". " + capitulo.titulo;

                const conteudo = document.createElement("p");
                conteudo.className = "conteudo-capitulo";
                conteudo.textContent = capitulo.conteudo || "Sem conteúdo.";

                const editar = document.createElement("button");
                editar.type = "button";
                editar.textContent = "Editar capítulo";
                editar.addEventListener("click", () => {
                    campoCapituloId.value = capitulo.id;
                    campoTituloCapitulo.value = capitulo.titulo;
                    campoOrdemCapitulo.value = capitulo.ordem;
                    campoConteudoCapitulo.value = capitulo.conteudo || "";
                    botaoSalvarCapitulo.textContent = "Salvar alterações";
                    botaoCancelarCapitulo.hidden = false;
                    mostrarMensagemCapitulo("");
                    campoTituloCapitulo.focus();
                });

                cartao.append(titulo, conteudo, editar);
                listaCapitulos.appendChild(cartao);
            });
        } catch (erro) {
            listaCapitulos.textContent = erro.message;
        }
    }

    async function carregarLivros() {
        lista.textContent = "Carregando livros...";

        try {
            const resposta = await fetch("/api/livros");
            if (!resposta.ok) throw new Error("Falha ao carregar livros.");

            const livros = await resposta.json();
            lista.replaceChildren();

            if (livros.length === 0) {
                lista.textContent = "Nenhum livro cadastrado.";
                lista.className = "vazio";
                return;
            }

            lista.className = "";

            livros.forEach(livro => {
                const cartao = document.createElement("article");
                cartao.className = "livro";

                const titulo = document.createElement("h3");
                titulo.textContent = livro.titulo;

                const autor = document.createElement("p");
                autor.textContent = "Autor: " + (livro.autor || "Não informado");

                const descricao = document.createElement("p");
                descricao.textContent = livro.descricao || "Sem descrição.";

                const editar = document.createElement("button");
                editar.textContent = "Editar";
                editar.addEventListener("click", () => {
                    campoId.value = livro.id;
                    campoTitulo.value = livro.titulo;
                    campoAutor.value = livro.autor || "";
                    campoDescricao.value = livro.descricao || "";

                    document.getElementById("titulo-formulario")
                        .textContent = "Editar livro";
                    botaoSalvar.textContent = "Salvar alterações";
                    botaoCancelar.hidden = false;
                    mostrarMensagem("");
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });

                const gerenciarCapitulos = document.createElement("button");
                gerenciarCapitulos.type = "button";
                gerenciarCapitulos.className = "secundario";
                gerenciarCapitulos.textContent = "Gerenciar capítulos";
                gerenciarCapitulos.addEventListener("click", () => {
                    abrirCapitulos(livro);
                });

                const baixarPdf = document.createElement("button");
                baixarPdf.type = "button";
                baixarPdf.className = "secundario";
                baixarPdf.textContent = "Baixar PDF";
                baixarPdf.addEventListener("click", () => {
                    window.location.href =
                        `/api/livros/${livro.id}/exportar/pdf`;
                });

                const baixarEpub = document.createElement("button");
                baixarEpub.type = "button";
                baixarEpub.className = "secundario";
                baixarEpub.textContent = "Baixar EPUB";
                baixarEpub.addEventListener("click", () => {
                    window.location.href =
                        `/api/livros/${livro.id}/exportar/epub`;
                });

                cartao.append(
                    titulo,
                    autor,
                    descricao,
                    editar,
                    gerenciarCapitulos,
                    baixarPdf,
                    baixarEpub
                );
                lista.appendChild(cartao);
            });
        } catch (erro) {
            lista.textContent = erro.message;
        }
    }

    formularioCapitulo.addEventListener("submit", async evento => {
        evento.preventDefault();

        const id = campoCapituloId.value;
        const titulo = campoTituloCapitulo.value.trim();
        const ordem = Number(campoOrdemCapitulo.value);

        if (!titulo) {
            mostrarMensagemCapitulo("Informe o título do capítulo.");
            return;
        }

        if (!Number.isInteger(ordem) || ordem < 1) {
            mostrarMensagemCapitulo(
                "A ordem deve ser um número inteiro positivo."
            );
            return;
        }

        const dados = {
            titulo,
            ordem,
            conteudo: campoConteudoCapitulo.value
        };

        botaoSalvarCapitulo.disabled = true;

        try {
            const url = id
                ? "/api/capitulos/" + id
                : "/api/livros/" + livroCapitulosId + "/capitulos";

            const resposta = await fetch(url, {
                method: id ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            const resultado = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    resultado.erro || "Não foi possível salvar o capítulo."
                );
            }

            limparFormularioCapitulo();
            mostrarMensagemCapitulo(
                id ? "Capítulo atualizado!" : "Capítulo cadastrado!"
            );
            await carregarCapitulos();
            await carregarLivros();
        } catch (erro) {
            mostrarMensagemCapitulo(erro.message);
        } finally {
            botaoSalvarCapitulo.disabled = false;
        }
    });

    botaoCancelarCapitulo.addEventListener("click", () => {
        limparFormularioCapitulo();
        mostrarMensagemCapitulo("");
    });

    document.getElementById("botao-fechar-capitulos")
        .addEventListener("click", () => {
            painelCapitulos.hidden = true;
            livroCapitulosId = null;
            limparFormularioCapitulo();
        });

    formulario.addEventListener("submit", async evento => {
        evento.preventDefault();

        const id = campoId.value;
        const dados = {
            titulo: campoTitulo.value.trim(),
            autor: campoAutor.value.trim(),
            descricao: campoDescricao.value.trim()
        };

        if (!dados.titulo) {
            mostrarMensagem("Informe o título do livro.");
            return;
        }

        botaoSalvar.disabled = true;

        try {
            const resposta = await fetch(
                id ? `/api/livros/${id}` : "/api/livros",
                {
                    method: id ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                }
            );

            const resultado = await resposta.json();

            if (!resposta.ok) {
                throw new Error(resultado.erro || "Não foi possível salvar.");
            }

            cancelarEdicao();
            mostrarMensagem(id ? "Livro atualizado!" : "Livro cadastrado!");
            await carregarLivros();
        } catch (erro) {
            mostrarMensagem(erro.message);
        } finally {
            botaoSalvar.disabled = false;
        }
    });

    botaoCancelar.addEventListener("click", () => {
        cancelarEdicao();
        mostrarMensagem("");
    });

    carregarLivros();
</script>
<script src="/static/js/autosalvamento-capitulos.js"></script>
</body>
</html>
